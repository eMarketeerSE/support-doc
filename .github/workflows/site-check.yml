name: site-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.nvmrc
          cache: yarn
          cache-dependency-path: site/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
        if: ${{ !cancelled() }}
      - run: yarn build
        if: ${{ !cancelled() }}
        env:
          SITE_STAGE: dev
      - run: yarn check-build
        if: ${{ !cancelled() }}
